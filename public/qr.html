<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Dinto As-Builts — QR labels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink:#161826; --muted:#75798c; --line:#e3e4ea; --accent:#5d5294; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink); background:#fff; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; position:sticky; top:0; background:#fff; z-index:5; }
  h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; }
  h1 span { color:var(--muted); }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  input[type=text] { min-width:280px; padding:7px 9px; font:inherit; font-size:13px; border:1px solid #cfd0d8; border-radius:6px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:5px 11px; font-size:12.5px; border:1px solid #cfd0d8; border-radius:6px; background:#fff; cursor:pointer; }
  .chip[aria-pressed=true] { color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); font-weight:600; }
  button.print { margin-left:auto; padding:8px 16px; font:inherit; font-weight:600; font-size:13px; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  .count { font-size:12px; color:var(--muted); }
  main { padding:18px 22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px 10px; text-align:center; break-inside:avoid; }
  .card .qr { display:flex; justify-content:center; }
  .card .qr img, .card .qr canvas { width:130px !important; height:130px !important; }
  .card .name { font-family:ui-monospace,Menlo,monospace; font-size:16px; font-weight:600; margin-top:8px; word-break:break-word; }
  .card .sys { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin-top:2px; }
  .card .url { font-size:9px; color:var(--muted); margin-top:3px; word-break:break-all; }
  .card .dl { display:inline-block; margin-top:8px; font-size:11px; color:var(--accent); border:1px solid #cfd0d8; border-radius:5px; padding:3px 9px; cursor:pointer; text-decoration:none; }
  .card .dl:hover { background:#f4f3fa; }
  @media print { .card .dl { display:none; } }
  .empty { color:var(--muted); font-size:13px; padding:30px; grid-column:1 / -1; }
  @media print {
    header { display:none; }
    main { padding:0; gap:8px; grid-template-columns:repeat(4,1fr); }
    .card { border-color:#bbb; }
    @page { margin:10mm; }
  }
</style>
</head>
<body>
<header>
  <h1>Dinto <span>As-Builts</span> · QR labels</h1>
  <div class="chips" id="systems"></div>
  <label>Site address
    <input id="base" type="text" placeholder="https://asbuilt.dintoelectric.com" />
  </label>
  <div class="chips" id="floors"></div>
  <span class="count" id="count"></span>
  <button class="print" onclick="window.print()">Print labels</button>
</header>
<main id="grid"><div class="empty">Loading panels…</div></main>
<script>
  // Each system has its own data file and its own QR path.
  // Power keeps /p/<panel> so labels already printed keep working.
  var SYSTEMS = [
    { id: 'power',     label: 'Power',            data: 'data/panels.json',            path: '/p/',  tag: '',                  filePrefix: '' },
    { id: 'firealarm', label: 'Fire Alarm',       data: 'data/firealarm/panels.json',  path: '/fa/', tag: 'Fire Alarm',        filePrefix: 'FA-' },
    { id: 'lighting',  label: 'Lighting Control', data: 'data/lighting/panels.json',   path: '/lc/', tag: 'Lighting Control',  filePrefix: 'LC-' }
  ];
  var SYS = SYSTEMS[0], PANELS = [], FLOOR = 'All';

  function floorOf(p){ var m=String(p).match(/(\d)-/); return m ? 'Level '+m[1] : 'Other'; }
  function baseUrl(){
    var v = document.getElementById('base').value.trim().replace(/\/+$/,'');
    return v || 'https://asbuilt.dintoelectric.com';
  }
  function panelUrl(name){ return baseUrl() + SYS.path + encodeURIComponent(name); }

  function render(){
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var list = PANELS.filter(function(p){ return SYS.id !== 'power' || FLOOR==='All' || floorOf(p)===FLOOR; });
    document.getElementById('count').textContent = list.length + ' label' + (list.length===1?'':'s');
    if(!list.length){ grid.innerHTML = '<div class="empty">No panels.</div>'; return; }
    list.forEach(function(name){
      var url = panelUrl(name);
      var card = document.createElement('div'); card.className='card';
      var qr = document.createElement('div'); qr.className='qr';
      card.appendChild(qr);
      var nm = document.createElement('div'); nm.className='name'; nm.textContent=name; card.appendChild(nm);
      if (SYS.tag) { var st = document.createElement('div'); st.className='sys'; st.textContent=SYS.tag; card.appendChild(st); }
      var u = document.createElement('div'); u.className='url'; u.textContent=url; card.appendChild(u);
      var dl = document.createElement('a'); dl.className='dl'; dl.textContent='Download PNG';
      dl.onclick = function(){ var cv = qr.querySelector('canvas'); if(cv){ var a=document.createElement('a'); a.download=SYS.filePrefix+name+'.png'; a.href=cv.toDataURL('image/png'); a.click(); } };
      card.appendChild(dl);
      grid.appendChild(card);
      new QRCode(qr, { text:url, width:130, height:130, correctLevel: QRCode.CorrectLevel.M });
    });
  }

  function buildFloors(){
    var host=document.getElementById('floors');
    host.innerHTML = '';
    if (SYS.id !== 'power') return; // floor filter only applies to Power panel names
    var order=['Level 1','Level 2','Level 3','Level 4','Level 5','Other'];
    var present=order.filter(function(f){ return PANELS.some(function(p){ return floorOf(p)===f; }); });
    ['All'].concat(present).forEach(function(f){
      var b=document.createElement('button'); b.className='chip'; b.textContent=(f==='All'?'All':f.replace('Level ','L'));
      b.setAttribute('aria-pressed', f===FLOOR ? 'true':'false');
      b.onclick=function(){ FLOOR=f; [].forEach.call(host.children,function(c){ c.setAttribute('aria-pressed','false'); }); b.setAttribute('aria-pressed','true'); render(); };
      host.appendChild(b);
    });
  }

  function buildSystems(){
    var host=document.getElementById('systems');
    host.innerHTML = '';
    SYSTEMS.forEach(function(s){
      var b=document.createElement('button'); b.className='chip'; b.textContent=s.label;
      b.setAttribute('aria-pressed', s.id===SYS.id ? 'true':'false');
      b.onclick=function(){ loadSystem(s); };
      host.appendChild(b);
    });
  }

  function loadSystem(s){
    SYS = s; FLOOR = 'All'; PANELS = [];
    buildSystems();
    document.getElementById('floors').innerHTML = '';
    document.getElementById('count').textContent = '';
    var grid = document.getElementById('grid');
    grid.innerHTML = '<div class="empty">Loading panels…</div>';
    fetch(s.data).then(function(r){
      if(!r.ok) throw new Error('missing');
      return r.json();
    }).then(function(d){
      if(!d || !Array.isArray(d.panels) || !d.panels.length) throw new Error('empty');
      PANELS = d.panels.map(function(p){ return p.panel; }).sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); });
      buildFloors(); render();
    }).catch(function(){
      grid.innerHTML = s.id === 'power'
        ? '<div class="empty">Could not load panels.json — make sure this page is opened from the deployed site.</div>'
        : '<div class="empty">No ' + s.label + ' data yet — labels will appear here once panels are added.</div>';
    });
  }

  // default the site field to this page's origin when served over http(s)
  if (location.origin && /^https?:/.test(location.origin)) document.getElementById('base').value = location.origin;
  document.getElementById('base').addEventListener('input', render);

  loadSystem(SYSTEMS[0]);
</script>
</body>
</html>
